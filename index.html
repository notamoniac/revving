<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPMometer</title>
  <link rel="   stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
<div class="RPMometer-wrap">
  <canvas id="rpm-canvas" width="300" height="100"></canvas>
  <div class="arrow"></div>
  <div>
    <div id="RPMometer"></div>
  </div>
</div>
<h1>Gear: <span id="gear">0</span></h1>
<button id="rev">Press W to accelerate</button>
<button id="shiftup">Press V to shift up</button>
<button id="shiftdown">Press C to shift down</button>
<button id="toggle-sound">Unmute sound</button>
</body>
</html>
